modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
showAsResourcePack=false

[[mods]]
  modId="${mod_id}"
  version="${mod_version}"
  displayName="${mod_name}"
  authors="${mod_authors}"
  description='''${mod_description}'''
  displayTest="MATCH_VERSION"

[[dependencies.${mod_id}]]
  modId="forge"
  mandatory=true
  versionRange="${forge_version_range}"
  ordering="NONE"
  side="BOTH"

[[dependencies.${mod_id}]]
  modId="minecraft"
  mandatory=true
  versionRange="${minecraft_version_range}"
  ordering="NONE"
  side="BOTH"

[[dependencies.${mod_id}]]
  modId="jei"
  mandatory=false
  versionRange="[7.6,)"
  ordering="NONE"
  side="CLIENT"

[[dependencies.${mod_id}]]
  modId="jade"
  mandatory=false
  versionRange="[2.8,)"
  ordering="NONE"
  side="BOTH"
